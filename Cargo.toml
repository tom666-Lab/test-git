[package]
name = "vpn-airport"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vpn-airport"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
bytes = "1.5"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
dashmap = "5.5"

[profile.release]
opt-level = 3
lto = true
